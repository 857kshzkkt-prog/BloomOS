# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║                                                                           ║
# ║                    LIMINE BOOTLOADER CONFIGURATION                       ║
# ║                         Bloom OS — 64-bit Arch CLI                        ║
# ║                                                                           ║
# ╚═══════════════════════════════════════════════════════════════════════════╝
#
# This is the production-grade limine.cfg file for Bloom OS.
# Place this at: /boot/limine/limine.cfg (or on ESP: EFI/limine/limine.cfg)
#
# ═══════════════════════════════════════════════════════════════════════════
# BOOTLOADER GLOBAL SETTINGS
# ═══════════════════════════════════════════════════════════════════════════

# ── Timeout configuration ───────────────────────────────────────────────────
# Time in seconds before auto-booting the default entry
TIMEOUT=5

# Disable built-in editor (force CLI-only)
EDITOR=no

# Enable verbose boot output for debugging
VERBOSE=yes

# Enable graphical boot menu
GRAPHICS=yes

# ═══════════════════════════════════════════════════════════════════════════
# COLOUR THEME: Cherry Blossom (Sakura)
# ═══════════════════════════════════════════════════════════════════════════

# Dark plum-black background (matches terminal aesthetic)
BACKGROUND=#1a0a0e

# Sakura pink text (elegant, readable)
TEXT=#ffb7c5

# Hot pink highlight (selection marker)
HIGHLIGHT=#ff69b4

# Medium violet-red border (subtle framing)
BORDER=#c71585

# ═══════════════════════════════════════════════════════════════════════════
# BOOT ENTRY 1: Bloom OS (Primary)
# ═══════════════════════════════════════════════════════════════════════════

:Bloom OS (64-bit Arch CLI Mode)
    # Use standard Linux boot protocol
    PROTOCOL=linux

    # Path to Blossom kernel image (absolute from boot partition root)
    KERNEL_PATH=boot:///boot/vmlinuz-blossom

    # Path to initramfs (compressed initial RAM disk)
    # The initramfs contains early userspace needed to mount the root filesystem
    MODULE_PATH=boot:///boot/initramfs-blossom.img

    # ═══════════════════════════════════════════════════════════════════════
    # KERNEL COMMAND-LINE PARAMETERS
    # ═══════════════════════════════════════════════════════════════════════
    #
    # ROOT=           - Root partition device (UUID or device name)
    # RW              - Mount root as read-write
    # QUIET           - Suppress kernel boot messages (clean splash)
    # LOGLEVEL=3      - Only show critical messages (0=debug, 3=errors only)
    # POOL=slub       - Use SLUB memory allocator (more memory-efficient)
    # VIDEO=          - Force 1080p@60Hz on HDMI, DisplayPort, and VGA
    # CONSOLEBLANK=0  - Disable console blanking (keep display active)
    # VT.DEFAULT_UTF8=1 - Enable UTF-8 console by default
    #
    # NOTE: The "ROOT_DEVICE" placeholder will be replaced by bloominstall
    #       or must be manually set (e.g., /dev/sda2 or UUID=xxxxxxxx-xxxx)
    #
    KERNEL_CMDLINE=root=ROOT_DEVICE rw quiet loglevel=3 pool=slub \
        video=HDMI-A-1:1920x1080@60 \
        video=DP-1:1920x1080@60 \
        video=VGA-1:1920x1080@60 \
        consoleblank=0 vt.default_utf8=1

    # Menu display name
    DISPLAY_NAME=Bloom OS — Blossom kernel (64-bit CLI)

# ═══════════════════════════════════════════════════════════════════════════
# BOOT ENTRY 2: Bloom OS (Fallback Initramfs)
# ═══════════════════════════════════════════════════════════════════════════
#
# This entry uses the fallback initramfs which includes ALL kernel modules
# for maximum hardware compatibility. Use this if the primary entry fails
# to boot due to missing storage or network drivers.

:Bloom OS (Fallback Initramfs)
    PROTOCOL=linux

    # Same kernel but fallback initramfs (larger, more drivers included)
    KERNEL_PATH=boot:///boot/vmlinuz-blossom
    MODULE_PATH=boot:///boot/initramfs-blossom-fallback.img

    # Same kernel parameters as primary
    KERNEL_CMDLINE=root=ROOT_DEVICE rw quiet loglevel=3 pool=slub \
        video=HDMI-A-1:1920x1080@60 \
        video=DP-1:1920x1080@60 \
        video=VGA-1:1920x1080@60 \
        consoleblank=0 vt.default_utf8=1

    # Same cherry blossom colour theme
    BACKGROUND=#1a0a0e
    TEXT=#ffb7c5
    HIGHLIGHT=#ff69b4
    BORDER=#c71585

    DISPLAY_NAME=Bloom OS — Fallback Mode

# ═══════════════════════════════════════════════════════════════════════════
# BOOT ENTRY 3: Memtest (Optional - for RAM diagnostics)
# ═══════════════════════════════════════════════════════════════════════════

:Memtest86+ (Memory Diagnostics)
    PROTOCOL=multiboot2
    MODULE_PATH=boot:///boot/memtest

    DISPLAY_NAME=Memtest86+ — RAM Diagnostics

# ═══════════════════════════════════════════════════════════════════════════
# BOOT ENTRY 4: Reboot
# ═══════════════════════════════════════════════════════════════════════════

:Reboot System
    PROTOCOL=linux
    KERNEL_PATH=boot:///boot/vmlinuz-blossom
    KERNEL_CMDLINE=reboot

    DISPLAY_NAME=Reboot

# ═══════════════════════════════════════════════════════════════════════════
# BOOT ENTRY 5: Power Off
# ═══════════════════════════════════════════════════════════════════════════

:Power Off
    PROTOCOL=linux
    KERNEL_PATH=boot:///boot/vmlinuz-blossom
    KERNEL_CMDLINE=poweroff

    DISPLAY_NAME=Power Off System

# ═══════════════════════════════════════════════════════════════════════════
# END OF LIMINE CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════